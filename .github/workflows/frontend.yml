name: Build and publish frontend image

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  DOCKERHUB_USERNAME: tazmans
  IMAGE_NAME: smartcar-frontend

jobs:
  version:
    runs-on: ubuntu-latest

    outputs:
      front_version: ${{ steps.update_front.outputs.front_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Update frontend version
        id: update_front
        run: |
          npm version patch --no-git-tag-version
          echo "front_version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"

      - name: Upload version files
        uses: actions/upload-artifact@v4
        with:
          name: frontend-version-files
          path: |
            package.json
            package-lock.json

  build:
    needs: version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ needs.version.outputs.front_version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: frontend-version-files
          path: .

      - name: Commit version changes
        run: |
          git config user.name "Smartcar CI"
          git config user.email "ci@smartcar.local"
          git add package.json package-lock.json

          if git diff --cached --quiet; then
            echo "No version changes"
          else
            git commit -m "ci: bump frontend version [skip ci]"
            git push
          fi

  deploy:
    needs:
      - version
      - release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout deployment repository
        uses: actions/checkout@v4
        with:
          repository: TazmanS/smartcar-devops
          token: ${{ secrets.DEPLOYMENT_REPO_TOKEN }}
          path: deployment
          fetch-depth: 0

      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Show yq version
        run: yq --version

      - name: Update frontend image version
        working-directory: deployment
        run: |
          yq -i '
            .spec.template.spec.containers[0].image =
            "tazmans/smartcar-frontend:${{ needs.version.outputs.front_version }}"
          ' kubernetes/base/frontend/deployment.yaml

      - name: Commit deployment changes
        working-directory: deployment
        run: |
          git config user.name "SmartCar CI"
          git config user.email "ci@smartcar.local"

          git add kubernetes/base/frontend/deployment.yaml

          if git diff --cached --quiet; then
            echo "No deployment changes"
          else
            git commit -m "ci: update frontend image version"
            git push
          fi